[workspace]
# Explicit because this is a virtual manifest: a virtual workspace defaults to
# resolver "1" regardless of edition. The old root package was edition 2024
# (→ resolver "3"), so pin "3" to preserve the prior feature-resolution behavior.
resolver = "3"
members = [
    "cli",
    "desktop",
    "crates/sapphire-agent-core",
]
# Keep the bare `cargo build` / `cargo test` at the repo root scoped to the
# `sapphire-agent` binary, as it was when it was the root package. Without
# this a virtual workspace defaults to all members, dragging in the desktop
# (bevy) build. CI targets the full set explicitly via
# `--workspace` / `--package`, so it is unaffected.
default-members = ["cli"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde_json = "1.0"
tokio = { version = "1.52", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
] }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluo10/sapphire-agent"
