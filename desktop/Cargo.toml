[package]
name = "sapphire-agent-desktop"
version = "0.8.2"
edition.workspace = true
description = "Desktop GUI client for sapphire-agent (bevy + egui)"
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-agent-desktop"
path = "src/main.rs"

[dependencies]
# Everything a future mobile app shares with the desktop: the chat, its
# connection to the agent running on this host and the egui setup. The
# desktop adds only the window, the camera and logging.
sapphire-agent-gui = { path = "../crates/sapphire-agent-gui" }

# Game engine — needed up front for the eventual 3D character work
# (the desktop companion's avatar). For the chat-only first cut we use only
# the windowing + render essentials, but pinning bevy now keeps us from
# rewriting the runtime later. Default features are deliberately
# avoided: bevy ships ~70 of them, including audio and asset loaders we
# don't need yet, and pulling them all in slows the cold build by minutes.
bevy = { version = "0.20", default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_text",
    "bevy_ui",
    "bevy_sprite",
    # bevy_egui enables its `picking` feature by default and emits
    # a warning at startup if bevy's matching `bevy_picking` isn't on;
    # without it, the picking plugin isn't installed and bevy_egui's
    # input + render path doesn't wire up correctly (window paints
    # black, no UI visible).
    "bevy_picking",
    "default_font",
    "x11",
    "wayland",
    "multi_threaded",
] }

# Logging
tracing = "0.1"
tracing-subscriber.workspace = true

# The companion window (src/companion_window.rs): the display handle that
# tells Wayland, where the global pointer cannot be read, apart.
raw-window-handle = "0.6"

# The global pointer (src/global_pointer.rs), read while the companion window
# lets clicks through and gets no cursor events of its own. On Linux through
# Xlib loaded at run time (x11-dl, as winit does), so libX11 is no hard
# dependency of the binary; device_query would link it.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
device_query = "4.0.1"

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-agent sapphire-agent-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-windows-x86_64.exe"
