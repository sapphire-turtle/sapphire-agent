# Workspace-level configuration for sapphire-agent.
#
# This file travels with the workspace. It may set anything the host-local
# config can — providers and their endpoints, profiles, routing, MCP servers,
# tools — except credentials: a key named like one (`api_key`, `api_keys`,
# `*_api_key`, `*_token`, `secret`, `password`, …, at any depth),
# `workspace_dir`, `[tools.host_access]` (each device decides whether the
# agent may use its shell) and `[serve]` (a bind address) are dropped and
# named in a warning at startup. Put those in the host-local config, which
# is layered over this file and wins wherever both set a key. Run
# `sapphire-agent verify` to see where each effective value came from.
#
# Because this file can define MCP servers and `[tools.admin]`, whoever can
# write it can run commands on every host that syncs the workspace. Treat
# write access to it accordingly.

# Heartbeat cron tasks are off in a fresh workspace, so a test rig sharing
# a machine with a live agent cannot fire duplicate scheduled tasks. Turn
# it on once the workspace is doing real work.
heartbeat_enabled = false

# Hour the agent's "day" rolls over, for daily logs and session policy.
# day_boundary_hour = 4

# What happens to a session at the day boundary:
#   "reset"   close it; the next message starts a new one
#   "compact" keep it, summarising the prior day into a stub
#   "none"    do nothing
# session_policy = "compact"

# Write a daily log at each day boundary.
# daily_log_enabled = true

# Periodically compact MEMORY.md.
# memory_compaction_enabled = true

# Re-index the workspace this often, in minutes.
# sync_interval_minutes = 15

# Autonomous sessions: the agent works on tasks from autonomous/*.md
# when no other session has been active for this long. Off in a fresh
# workspace for the same reason heartbeat is — a test rig sharing a
# machine should not start working on its own.
# [autonomous]
# enabled = false
# idle_minutes = 30
# poll_seconds = 60
# origin = "trusted"   # "trusted" (everything, needs [tools] host_access) | "channel" (no shell)

# The agent's model and framing. The API key itself is host-local.
# [anthropic]
# model = "claude-sonnet-5"
# light_model = "claude-haiku-4-5-20251001"
# max_tokens = 8192
# system_prompt = "..."

# How many digest items each log level contributes to the system prompt.
# [digest]
# daily_items = 3
# weekly_items = 3
# monthly_items = 5
# yearly_items = 5
# weekly_enabled = true
# monthly_enabled = true
# yearly_enabled = true

# Which rooms and devices run under which profile, and which memory
# namespace they read. `default` catches everything not listed elsewhere.
# [room_profile.default]
# memory_namespace = "default"

# An OpenAI-compatible provider and a profile that uses it. Its `api_key`
# goes under the same `[providers.<name>]` in the host-local config.
# [providers.local]
# type = "openai_compatible"
# base_url = "http://127.0.0.1:8080/v1"
# model = "qwen"
#
# [profiles.local]
# provider = "local"
