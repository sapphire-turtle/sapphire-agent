name: Release-plz

# The headless edition (`sapphire-agent-headless`) and the desktop app share
# one version and its `v{version}` tag, which the headless one makes
# (release-plz.toml). Both binaries are built once release-plz has made the
# release.
#
# Off on push for now: the next release waits for the desktop app's Velopack
# packaging (sapphire-turtle/corundum-framework#51), and until then its
# "install & start" registers the sibling headless binary instead of itself
# (sapphire-framework#366). Releases are run by hand; put the push trigger back
# after that release (#338).
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    secrets: inherit

  build:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-agent-headless')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-agent-headless'] }}
