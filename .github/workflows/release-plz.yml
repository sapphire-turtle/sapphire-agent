name: Release-plz

# The headless edition (`sapphire-agent-headless`) and the desktop app share
# one version and its `v{version}` tag, which the headless one makes
# (release-plz.toml). The binaries are built once release-plz has made the
# release; for now only the headless one (release-binaries.yml, #334).
#
# Off on push for now: releases are run by hand, and carry the headless edition
# alone until the desktop app is ready (#334). Put the push trigger back once
# the desktop app is released too (#338).
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    secrets: inherit

  build:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-agent-headless')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-agent-headless'] }}
