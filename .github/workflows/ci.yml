name: CI

on:
  pull_request:

jobs:
  ci:
    uses: sapphire-turtle/sapphire-framework/.github/workflows/shared-rust-ci.yml@main
    with:
      # bevy (the desktop) needs X11, Wayland and xkbcommon; bevy_winit talks
      # to udev for device hot-plug events.
      linux-packages: >-
        pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
        libxi-dev libxcursor-dev libxrandr-dev
      pre-build: .github/scripts/refresh-sherpa-onnx-libs.sh
