name: Release desktop binaries

# Builds the cross-platform sapphire-agent-desktop binaries and uploads
# them as release assets onto an existing GitHub release.
#
# Triggered as a reusable workflow from release-plz.yml (right after
# the tag + release are created) plus a workflow_dispatch fallback for
# retroactive uploads. `push: tags` is intentionally omitted because
# release-plz's GITHUB_TOKEN tag pushes don't fire downstream
# workflows.
#
# Compared to release.yml (sapphire-agent), Linux needs extra system
# packages for bevy + cpal (X11/Wayland/ALSA/udev). The desktop crate
# is `publish = false`, so this workflow is the only delivery path —
# users install via `gh release download`, not `cargo install`.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. sapphire-agent-desktop-v0.1.0).'
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. sapphire-agent-desktop-v0.1.0).'

jobs:
  build:
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: sapphire-agent-desktop
            asset_name: sapphire-agent-desktop-linux-x86_64
            continue-on-error: false
          - os: ubuntu-24.04-arm
            binary: sapphire-agent-desktop
            asset_name: sapphire-agent-desktop-linux-aarch64
            continue-on-error: false
          - os: macos-latest
            binary: sapphire-agent-desktop
            asset_name: sapphire-agent-desktop-macos-aarch64
            continue-on-error: true
          # No Windows entry: the desktop talks to the agent running on the
          # same host over its local IPC endpoint (#278), and the agent has
          # no Windows build (#182).
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # bevy needs X11 + Wayland + libxkbcommon; bevy_winit talks to udev
      # for device hot-plug events. Only required on Linux — macOS ships the
      # equivalents in the base SDK.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package sapphire-agent-desktop

      - name: Package binary
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.asset_name }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.asset_name }}
