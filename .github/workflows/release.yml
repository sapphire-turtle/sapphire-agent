name: Release binaries

# Builds the cross-platform sapphire-agent binaries and uploads them as
# release assets onto an existing GitHub release.
#
# Triggered as a reusable workflow from release-plz.yml (so the run
# happens immediately after release-plz creates the tag + release),
# plus a `workflow_dispatch` trigger for retroactive runs against a
# tag whose binaries weren't uploaded on first release.
#
# A `push: tags` trigger is intentionally omitted: release-plz pushes
# tags using GITHUB_TOKEN, and GitHub Actions does not fire workflows
# on tags pushed by GITHUB_TOKEN. Using workflow_call from release-plz
# sidesteps that limitation without needing a PAT.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. sapphire-agent-v0.9.0).'
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. sapphire-agent-v0.9.0).'

jobs:
  build:
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: sapphire-agent
            asset_name: sapphire-agent-linux-x86_64
            continue-on-error: false
          - os: ubuntu-24.04-arm
            binary: sapphire-agent
            asset_name: sapphire-agent-linux-aarch64
            continue-on-error: false
          # No Windows entry: sapphire-agent is a headless server app (its
          # CLI included), and Windows was never its intended environment —
          # the server half does not link there. See #182.
          - os: macos-latest
            binary: sapphire-agent
            asset_name: sapphire-agent-macos-aarch64
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/refresh-sherpa-onnx-libs
      - run: cargo build --release --package sapphire-agent

      # sherpa-onnx links statically, so the asset is self-contained. Guard
      # it: under shared linking the libraries stay in `target/` and nothing
      # writes an RPATH, so the uploaded binary dies at every install site
      # with "libsherpa-onnx-c-api.so: cannot open shared object file". That
      # shipped once already (#182) because only Windows packaged the
      # libraries beside the executable.
      - name: Assert the binary is self-contained
        shell: bash
        run: |
          bin="target/release/${{ matrix.binary }}"
          case "$RUNNER_OS" in
            Linux) deps=$(ldd "$bin") ;;
            macOS) deps=$(otool -L "$bin") ;;
            *) echo "::error::no dynamic-link check for $RUNNER_OS"; exit 1 ;;
          esac
          if grep -i sherpa <<<"$deps"; then
            echo "::error::$bin links sherpa-onnx dynamically; this asset would not start"
            exit 1
          fi
          echo "$bin links no sherpa-onnx library — self-contained."

      - name: Package binary
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.asset_name }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.asset_name }}
