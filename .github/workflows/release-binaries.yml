name: Release binaries

# Builds the headless edition's and the desktop app's binaries for the release
# platforms and attaches them to an existing `v{version}` release, which the
# two share. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.12.0).'
        required: true
        type: string

jobs:
  # Both binaries are `sapphire-agent` on PATH; the files are named by crate
  # to tell them apart.
  headless:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-agent-headless
      binary: sapphire-agent
      asset: sapphire-agent-headless
      pre-build: .github/scripts/refresh-sherpa-onnx-libs.sh
      # sherpa-onnx must be linked in, or the file would not start once copied
      # away from target/.
      post-build: .github/scripts/assert-self-contained.sh "$BIN"

  # The desktop app runs the agent too, so it links sherpa-onnx the same way.
  desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-agent-desktop
      binary: sapphire-agent-desktop
      linux-packages: >-
        pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
        libxi-dev libxcursor-dev libxrandr-dev
      pre-build: .github/scripts/refresh-sherpa-onnx-libs.sh
      post-build: .github/scripts/assert-self-contained.sh "$BIN"
