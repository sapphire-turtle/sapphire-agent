# cargo-deny config. Run locally with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Restrict the dep graph to the platforms we actually publish binaries for
# (see release-binaries.yml). Drops UEFI/WASM-only transitive deps like `r-efi`
# (LGPL-2.1-or-later) so we don't need to allow their licenses.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "warn"
# Each ignore must have a reason field so the next contributor can judge
# whether the entry is still load-bearing. Re-evaluate when the upstream
# dep moves off the flagged package, or when a more severe advisory is
# filed.
ignore = [
    # --- unmaintained (no vulnerability) ---
    # The bincode (RUSTSEC-2025-0141) and encoding (RUSTSEC-2021-0153) entries
    # are gone: both reached us through lance, which left the graph when
    # sapphire-framework dropped its LanceDB backend. `cargo tree -i` finds
    # neither package now, even under --all-features. paste (RUSTSEC-2024-0436)
    # went the same way when the desktop moved to bevy 0.20.

    # --- unmaintained, reached only through the bevy/egui text stack ---
    # ttf-parser is unmaintained upstream (author-declared). It reaches us via
    # bevy_text > cosmic-text > fontdb and egui > epaint > ab_glyph >
    # owned_ttf_parser (winit/sctk-adwaita also pull it). RustSec lists no safe
    # upgrade; the suggested alternative (skrifa) is a different font stack.
    # Drop this once the upstream stacks migrate.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; transitive via bevy_text → cosmic-text → fontdb and egui → epaint → ab_glyph. No safe upgrade; the suggested alternative (skrifa) is a different stack." },

    # --- rustls-webpki 0.102.x advisories pinned by serenity → tokio-tungstenite 0.21 → tokio-rustls 0.25 → rustls 0.22 ---
    # Fixes are in rustls-webpki 0.103.x, which requires rustls 0.23. serenity
    # 0.12.5 (latest) is locked to the older rustls stack, so we can't upgrade
    # without serenity itself moving. None of these advisories are reachable
    # from this codebase's usage (no CRLs, no name constraints in Discord TLS).
    # Drop these once serenity ships a release on rustls 0.23.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.x CRL distribution-point matching; transitive via serenity → tokio-tungstenite 0.21." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.x URI name-constraint acceptance; transitive via serenity → tokio-tungstenite 0.21." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.x wildcard-name constraint acceptance; transitive via serenity → tokio-tungstenite 0.21." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.x CRL parsing panic; transitive via serenity → tokio-tungstenite 0.21." },

    # --- quick-xml 0.39.x advisories (RUSTSEC-2026-0194/0195, DTD/attribute
    # DoS) ---
    # Fixed in quick-xml 0.41.0, reached transitively via wayland-scanner 0.31.
    # Updated past the advisory in the same commit as this note; kept as a
    # marker in case the wayland stack pins back down.
    # Drop these once wayland-scanner moves off the affected quick-xml range.

    # --- unmaintained, reached only through matrix-sdk ---
    # The 0.16 entries (bitmaps, proc-macro-error2) left the graph with
    # matrix-sdk 0.19. anymap2 is still a direct dependency of matrix-sdk
    # itself; RustSec lists no safe upgrade. Re-check on the next bump.
    { id = "RUSTSEC-2026-0319", reason = "anymap2 is unmaintained; a direct dependency of matrix-sdk 0.19. No safe upgrade." },

    # --- ruzstd 0.8 pinned by bevy (desktop only) ---
    # Fixed in ruzstd 0.9.1, but bevy_image requires ^0.8 — still so in bevy
    # 0.20 — and bevy_egui turns on its `zstd_rust` feature whenever
    # rendering is on, so it cannot be dropped. It decodes zstd-compressed
    # KTX2 textures, and the desktop client loads no such assets, let alone
    # untrusted ones. Drop this when bevy_image takes ruzstd 0.9.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd decompression bomb; reached only via the desktop's bevy_image, which pins ^0.8 through bevy 0.20 (KTX2 textures, none loaded)." },
]

[licenses]
# Permissive SPDX identifiers actually present in the resolved graph for
# the targets above. Re-survey with `cargo deny list --layout license`
# before widening.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.93
# Font licences, scoped to the one crate that carries fonts rather than added
# to `allow` above. OFL-1.1 and Ubuntu-font-1.0 govern the *typefaces* egui
# embeds as its fallback UI font, not the code; blanket-allowing them would
# also wave through a code dependency that happened to pick one. This crate
# is `(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0` — the code half is
# already allowed, and we ship an OFL font of our own in `desktop/assets/`.
#
# Only visible since the workspace root became a virtual manifest: cargo-deny
# assumes `--workspace` for a virtual manifest, but takes a root *package* as
# the sole graph root otherwise, so `sapphire-agent-desktop`'s tree had never
# been checked before.
exceptions = [
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Duplicate-version warnings are too noisy in real Rust workspaces (every
# transitively-pulled `syn`/`bitflags`/`hashbrown` version trips it).
multiple-versions = "allow"
wildcards = "deny"
# A `path` dependency without a version (a workspace crate's dev-dependency, or a
# crate that is not published) is not a wildcard on the registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# sapphire-framework is published to crates.io as of 0.13.0, so nothing in the
# graph comes from git any more.
allow-git = []
