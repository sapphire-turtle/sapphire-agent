[package]
name = "sapphire-agent-core"
version = "0.10.0"
edition.workspace = true
description = "Client library and shared protocol for sapphire-agent's local IPC chat"
license.workspace = true
repository.workspace = true

[dependencies]
# The app server's IPC transport: endpoint discovery, handshake, calls and
# notifications. Only the `ipc` module of the facade.
sapphire-framework = { version = "0.23.0", default-features = false, features = ["ipc"] }
# The framework's API version, named in the handshake. Not re-exported by
# the facade.
sapphire-framework-server-api = "5.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
# Attachments travel base64-encoded.
base64 = "0.23"
# Hashes an avatar upload.
sha2 = "0.11"

# Error handling
anyhow.workspace = true

# `select!` over a call and its notifications.
tokio = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
toml = "1.0"
