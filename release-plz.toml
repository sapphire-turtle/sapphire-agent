[workspace]
# Per-package tags / GitHub releases. Existing single-version tags like
# `v0.6.1` stay as historical anchors; new tags use the per-package form.
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }}-v{{ version }}"

# Static PR title. release-plz's `pr_name` context doesn't expose a per-package
# list (the `releases` variable is only available in `pr_body`), so dynamic
# titles for multi-package bumps aren't possible. The PR body lists the bumps,
# and per-package tags / GH releases use `{{ package }}-v{{ version }}` above.
pr_name = "chore(release): version bump"

# Custom git-cliff config to drop sibling-crate-scoped commits from the
# generated changelog entries. Doesn't suppress the version bump itself
# (release-plz decides "did this package change?" purely from file
# paths) — but it keeps the changelog readable. See cliff.toml for
# details.
changelog_config = "./cliff.toml"

# The one `sapphire-agent` binary: the server and its CLI (#278). Lives in
# `cli/`, and continues the server's changelog and version line.
[[package]]
name = "sapphire-agent"
changelog_path = "./cli/CHANGELOG.md"

[[package]]
name = "sapphire-agent-core"
changelog_path = "./crates/sapphire-agent-core/CHANGELOG.md"

[[package]]
name = "sapphire-agent-client"
changelog_path = "./crates/sapphire-agent-client/CHANGELOG.md"

# sapphire-agent-desktop ships as a GitHub-release-only binary (bevy +
# bundled font + ICE-licensed Lucide SVGs — not intended for crates.io,
# hence `publish = false` in its Cargo.toml). release-plz still creates
# the `sapphire-agent-desktop-v*` tag + GH release; the
# `.github/workflows/release-desktop.yml` workflow builds the binaries
# for that tag and attaches them as release assets.
#
# `release = true` is load-bearing: release-plz's default behaviour is
# to skip any crate whose Cargo.toml has `publish = false`, even if it
# appears in release-plz.toml. Without this line release-plz silently
# excludes the package from its scan and never tags new versions.
[[package]]
name = "sapphire-agent-desktop"
changelog_path = "./desktop/CHANGELOG.md"
publish = false
release = true
