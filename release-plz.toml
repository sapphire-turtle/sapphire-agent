[workspace]
# Tags and GitHub releases follow the sapphire-turtle convention
# (sapphire-turtle/.github's README.md): the two editions — the headless one
# and the desktop app — share one version and one `v{version}` tag and GitHub
# release, which the headless one makes; the libraries get none. Before that,
# the desktop app was tagged `desktop-v{version}`, and before the CLI and the
# server became one binary, tags were per package (`sapphire-agent-server-v…`,
# `sapphire-agent-cli-v…`).
git_tag_enable = false
git_release_enable = false
pr_labels = ["release"]

# Static PR title. release-plz's `pr_name` context doesn't expose a per-package
# list (the `releases` variable is only available in `pr_body`), so dynamic
# titles for multi-package bumps aren't possible. The PR body lists the bumps.
pr_name = "chore(release): version bump"

# Custom git-cliff config to drop sibling-crate-scoped commits from the
# generated changelog entries. Doesn't suppress the version bump itself
# (release-plz decides "did this package change?" purely from file paths) —
# but it keeps the changelog readable. See cliff.toml for details.
changelog_config = "./cliff.toml"

# The headless edition: the `sapphire-agent` binary without the GUI. A new
# crate at 0.12.0; up to 0.11.2 the binary was published as `sapphire-agent`.
[[package]]
name = "sapphire-agent-headless"
version_group = "app"
changelog_path = "./headless/CHANGELOG.md"
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The command line both editions run, and the app server it starts — the
# agent itself. They move with the editions: nothing outside this workspace
# builds on them. Both names were published as binaries up to 0.8.0, so they
# resume at 0.12.0.
[[package]]
name = "sapphire-agent-cli"
version_group = "app"

[[package]]
name = "sapphire-agent-server"
version_group = "app"

[[package]]
name = "sapphire-agent-core"
changelog_path = "./crates/sapphire-agent-core/CHANGELOG.md"

# sapphire-agent-gui is the GUI the desktop (and later a mobile app) is built
# on: a library inside their binaries, `publish = false`, with no tag or
# release of its own. Its changes ship as the apps' releases — but release-plz
# picks packages by path, so a change only under crates/sapphire-agent-gui/
# makes no desktop release: a user-visible GUI change must also touch
# desktop/ (a `(desktop)` commit, its CHANGELOG or version) in the same PR.
[[package]]
name = "sapphire-agent-gui"
release = false

# sapphire-agent-desktop ships as a GitHub-release-only binary (bevy + bundled
# font + ISC-licensed Lucide SVGs — not intended for crates.io, hence
# `publish = false` in its Cargo.toml), and runs the CLI too.
#
# It is not published, so its versions live in the shared `v{version}` tags
# the headless edition makes; release-binaries.yml builds both binaries for
# them. `git_only = true` is load-bearing: release-plz silently skips a crate
# whose Cargo.toml has `publish = false` unless it is set — `release = true`
# alone, which this file used before, no longer does it.
[[package]]
name = "sapphire-agent-desktop"
version_group = "app"
changelog_path = "./desktop/CHANGELOG.md"
git_only = true
# Overrides release-plz's default `publish = true`, which `git_only` refuses.
publish = false
# The tag its version is read from; the headless edition makes it.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
